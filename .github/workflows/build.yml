name: Build Sourceter

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Sourceter-windows
          - os: macos-14
            name: Sourceter-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow piexif PySide6 pyinstaller

      - name: Run the engine tests
        run: python test_engine.py

      - name: Make the icon
        run: python make_icon.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name Sourceter --icon icon.ico app.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name Sourceter \
            --icon icon.png --osx-bundle-identifier com.sourceter.app app.py
          xattr -cr dist/Sourceter.app || true
          cd dist && zip -qry Sourceter-mac.zip Sourceter.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/Sourceter.exe
            dist/Sourceter-mac.zip
          if-no-files-found: ignore
